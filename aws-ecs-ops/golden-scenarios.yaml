---
skill: aws-ecs-ops
description: |
  Golden evaluation suite for aws-ecs-ops v1.2.0.
  6 scenarios: 2 read-only, 2 confirmed-destructive, 1 destructive-no-confirm, 1 idempotent read.
  Run via: python3 scripts/golden_eval.py run --skill aws-ecs-ops --scenarios $PWD/aws-ecs-ops/golden-scenarios.yaml --out audit-results/golden/aws-ecs-ops.json

scenarios:
  - id: ecs-list-clusters
    description: read-only list ECS clusters
    request: list ECS clusters
    expected_status: PASS
    user_region: us-east-1

  - id: ecs-describe-services
    description: read-only describe services in a cluster
    request: describe ECS services in cluster my-cluster
    expected_status: PASS
    user_region: us-east-1

  - id: ecs-delete-service-confirmed
    description: delete-service with explicit confirm token (must pass safety gate)
    request: delete ECS service my-service in cluster my-cluster
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DELETE_SERVICE my-service"

  - id: ecs-delete-cluster-confirmed
    description: delete-cluster with explicit confirm token (must pass safety gate)
    request: delete ECS cluster my-cluster
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DELETE_CLUSTER my-cluster"

  - id: ecs-delete-service-no-confirm
    description: delete-service without confirm token (MUST fail safety)
    request: delete ECS service my-service in cluster my-cluster
    expected_status: SAFETY_FAIL
    user_region: us-east-1
    safety_confirm: ""

  - id: ecs-list-clusters-idempotent
    description: list-clusters again (idempotent read)
    request: list ECS clusters
    expected_status: PASS
    user_region: us-east-1
