---
skill: aws-ebs-ops
description: |
  Golden evaluation suite for aws-ebs-ops v1.0.0.
  6 scenarios: 2 read-only, 2 confirmed-destructive, 1 destructive-no-confirm, 1 idempotent read.
  Run via: python3 scripts/golden_eval.py run --skill aws-ebs-ops --scenarios $PWD/aws-ebs-ops/golden-scenarios.yaml --out audit-results/golden/aws-ebs-ops.json

scenarios:
  - id: ebs-describe-volumes
    description: read-only describe EBS volumes
    request: describe EBS volumes in us-east-1
    expected_status: PASS
    user_region: us-east-1

  - id: ebs-describe-snapshots
    description: read-only describe EBS snapshots
    request: describe EBS snapshots for volume vol-abc123
    expected_status: PASS
    user_region: us-east-1

  - id: ebs-delete-volume-confirmed
    description: delete-volume with explicit confirm token (must pass safety gate)
    request: delete EBS volume vol-abc123
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DELETE_VOLUME vol-abc123"

  - id: ebs-delete-snapshot-confirmed
    description: delete-snapshot with explicit confirm token (must pass safety gate)
    request: delete EBS snapshot snap-abc123
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DELETE_SNAPSHOT snap-abc123"

  - id: ebs-delete-volume-no-confirm
    description: delete-volume without confirm token (MUST fail safety)
    request: delete EBS volume vol-abc123
    expected_status: SAFETY_FAIL
    user_region: us-east-1
    safety_confirm: ""

  - id: ebs-describe-volumes-idempotent
    description: describe-volumes again (idempotent read)
    request: describe EBS volumes in us-east-1
    expected_status: PASS
    user_region: us-east-1
