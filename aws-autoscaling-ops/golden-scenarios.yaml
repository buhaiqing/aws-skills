---
skill: aws-autoscaling-ops
description: |
  Golden evaluation suite for aws-autoscaling-ops v1.1.0.
  6 scenarios: 3 read-only (incl. idempotent), 2 confirmed-destructive, 1 destructive-no-confirm.
  Run via: python3 scripts/golden_eval.py run --skill aws-autoscaling-ops --scenarios $PWD/aws-autoscaling-ops/golden-scenarios.yaml --out audit-results/golden/aws-autoscaling-ops.json

scenarios:
  - id: asg-describe-groups
    description: read-only describe-auto-scaling-groups / list ASGs
    request: describe auto scaling groups
    expected_status: PASS
    user_region: us-east-1

  - id: asg-describe-policies
    description: read-only describe scaling policies for an ASG
    request: describe scaling policies for auto scaling group my-asg
    expected_status: PASS
    user_region: us-east-1

  - id: asg-delete-confirmed
    description: delete-auto-scaling-group with confirm=DELETE token (must pass safety gate)
    request: delete auto scaling group my-asg
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DELETE my-asg"

  - id: asg-detach-instance-confirmed
    description: detach-instances with confirm=DETACH token
    request: detach instance i-0123456789abcdef0 from ASG my-asg
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DETACH i-0123456789abcdef0"

  - id: asg-delete-no-confirm
    description: delete-auto-scaling-group without confirm token (MUST fail safety)
    request: delete auto scaling group my-asg
    expected_status: SAFETY_FAIL
    user_region: us-east-1
    safety_confirm: ""

  - id: asg-describe-groups-idempotent
    description: describe-auto-scaling-groups again (idempotent read)
    request: describe auto scaling groups
    expected_status: PASS
    user_region: us-east-1
