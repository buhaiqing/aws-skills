name: composite-gate + setup-hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  composite-and-precommit-gate:
    name: composite lint + setup hooks + pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test + lint deps
        run: |
          python -m pip install 'ruff>=0.11.8,<0.17' pytest pyyaml
          echo "## Tooling" >> "$GITHUB_STEP_SUMMARY"
          echo "- python: $(command -v python) ($(python --version))" >> "$GITHUB_STEP_SUMMARY"
          echo "- python3: $(command -v python3) ($(python3 --version))" >> "$GITHUB_STEP_SUMMARY"
          echo "- ruff bin: $(command -v ruff)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ruff module: $(python -m ruff --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- python3 -m ruff: $(python3 -m ruff --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install hooks (so local devs match CI)
        run: bash scripts/install-hooks.sh

      - name: Composite lint (fail-closed)
        run: python3 scripts/composite_lint.py lint --all

      - name: Pytest (precommit subset first)
        env:
          PYTHON_BIN: python
        run: |
          set -o pipefail
          python -m pytest -p no:rerunfailures scripts/tests/test_precommit_hook.py -vv --tb=short 2>&1 | tee precommit-pytest.log
          {
            echo "## Precommit pytest"
            echo '```'
            tail -n 80 precommit-pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pytest regression
        env:
          PYTHON_BIN: python
        run: |
          set -o pipefail
          python -m pytest -p no:rerunfailures scripts/tests/ -q --tb=short 2>&1 | tee full-pytest.log
          {
            echo "## Full pytest (tail)"
            echo '```'
            tail -n 100 full-pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-logs
          path: |
            precommit-pytest.log
            full-pytest.log

      - name: Ruff lint
        run: ruff check scripts/

      - name: Self-review verify (no stale P0)
        run: python3 scripts/self_review.py verify
