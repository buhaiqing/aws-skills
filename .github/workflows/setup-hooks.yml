name: composite-gate + setup-hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  composite-and-precommit-gate:
    name: composite lint + setup hooks + pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test + lint deps
        run: |
          python -m pip install 'ruff>=0.11.8,<0.17' pytest pyyaml
          python -m ruff --version
          command -v ruff

      - name: Install hooks (so local devs match CI)
        run: bash scripts/install-hooks.sh

      - name: Composite lint (fail-closed)
        run: python3 scripts/composite_lint.py lint --all

      - name: Pytest (precommit subset first)
        env:
          PYTHON_BIN: python
        run: python -m pytest -p no:rerunfailures scripts/tests/test_precommit_hook.py -q --tb=short

      - name: Pytest regression
        id: pytest
        env:
          PYTHON_BIN: python
        run: |
          set -o pipefail
          python -m pytest -p no:rerunfailures scripts/tests/ -q --tb=short --junitxml=junit.xml 2>&1 | tee full-pytest.log

      - name: Capture pytest failures into repo
        if: failure() && steps.pytest.outcome == 'failure'
        run: |
          mkdir -p docs/ci
          {
            echo "# CI pytest failure ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "## Log tail"
            echo
            echo '```'
            tail -n 200 full-pytest.log
            echo '```'
            echo
            python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("junit.xml")
          if not p.exists():
              raise SystemExit(0)
          print("## Failed tests")
          print()
          root = ET.parse(p).getroot()
          for case in root.iter("testcase"):
              node = case.find("failure")
              if node is None:
                  node = case.find("error")
              if node is None:
                  continue
              cls = case.get("classname", "")
              name = case.get("name", "")
              print(f"- `{cls}::{name}`")
              msg = (node.get("message") or "").strip().splitlines()
              if msg:
                  print(f"  - {msg[0][:400]}")
          PY
          } > docs/ci/last-pytest-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci/last-pytest-failure.md
          git commit -m "ci: capture composite-gate pytest failure [skip ci]" || exit 0
          git push || exit 0

      - name: Upload pytest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-logs
          path: |
            full-pytest.log
            junit.xml

      - name: Ruff lint
        run: ruff check scripts/

      - name: Self-review verify (no stale P0)
        run: python3 scripts/self_review.py verify
