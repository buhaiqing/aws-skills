name: composite-gate + setup-hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  composite-and-precommit-gate:
    name: composite lint + setup hooks + pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test + lint deps
        run: |
          python -m pip install 'ruff>=0.11.8,<0.17' pytest pyyaml
          python -m ruff --version
          command -v ruff

      - name: Install hooks (so local devs match CI)
        run: bash scripts/install-hooks.sh

      - name: Composite lint (fail-closed)
        run: python3 scripts/composite_lint.py lint --all

      - name: Pytest (precommit subset first)
        env:
          PYTHON_BIN: python
        run: python -m pytest -p no:rerunfailures scripts/tests/test_precommit_hook.py -q --tb=short

      - name: Pytest regression
        id: pytest
        env:
          PYTHON_BIN: python
        run: |
          set -o pipefail
          python -m pytest -p no:rerunfailures scripts/tests/ -q --tb=short --junitxml=junit.xml 2>&1 | tee full-pytest.log

      - name: Publish pytest failure as Issue
        if: failure() && steps.pytest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## CI pytest failure"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "### Failed tests"
            echo
            python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("junit.xml")
          if not p.exists():
              print("_junit.xml missing_")
              raise SystemExit(0)
          root = ET.parse(p).getroot()
          found = False
          for case in root.iter("testcase"):
              node = case.find("failure")
              if node is None:
                  node = case.find("error")
              if node is None:
                  continue
              found = True
              cls = case.get("classname", "")
              name = case.get("name", "")
              print(f"- `{cls}::{name}`")
              msg = (node.get("message") or "").strip().splitlines()
              if msg:
                  print(f"  - {msg[0][:500]}")
              body = (node.text or "").strip()
              if body:
                  print()
                  print("```")
                  print(body[:4000])
                  print("```")
          if not found:
              print("_no failure/error nodes in junit_")
          PY
            echo
            echo "### Log tail"
            echo
            echo '```'
            tail -n 120 full-pytest.log
            echo '```'
          } > /tmp/pytest-failure.md
          # Drop stale capture issues from prior attempts (same title prefix)
          TITLE="ci-pytest-failure ${GITHUB_SHA::7}"
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/pytest-failure.md \
            --label "ci" 2>/dev/null \
          || gh issue create \
            --title "$TITLE" \
            --body-file /tmp/pytest-failure.md

      - name: Upload pytest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-logs
          path: |
            full-pytest.log
            junit.xml

      - name: Ruff lint
        run: ruff check scripts/

      - name: Self-review verify (no stale P0)
        run: python3 scripts/self_review.py verify
