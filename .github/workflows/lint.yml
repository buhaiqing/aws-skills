name: Ruff Lint (full repo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff-lint:
    name: ruff check . --fail-fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install 'ruff>=0.11.8,<0.17'

      - name: Ruff lint (full repo)
        run: ruff check . --output-format=github

      - name: Links lint (SKILL.md anchors)
        run: python3 scripts/links_lint.py lint --all
