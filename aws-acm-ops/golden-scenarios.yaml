---
skill: aws-acm-ops
description: |
  Golden evaluation suite for aws-acm-ops v1.0.0.
  6 scenarios: 3 read-only, 1 confirmed-destructive, 1 destructive-no-confirm, 1 idempotent read.
  Run via: python3 scripts/golden_eval.py run --skill aws-acm-ops --scenarios $PWD/aws-acm-ops/golden-scenarios.yaml --out audit-results/golden/aws-acm-ops.json

scenarios:
  - id: acm-list-certificates
    description: read-only list ACM certificates
    request: list ACM certificates
    expected_status: PASS
    user_region: us-east-1

  - id: acm-describe-certificate
    description: read-only describe an ACM certificate
    request: describe ACM certificate arn:aws:acm:us-east-1:123456789012:certificate/abcd-1234
    expected_status: PASS
    user_region: us-east-1

  - id: acm-delete-cert-confirmed
    description: delete-certificate with explicit confirm token (must pass safety gate)
    request: delete ACM certificate arn:aws:acm:us-east-1:123456789012:certificate/abcd-1234
    expected_status: PASS
    user_region: us-east-1
    safety_confirm: "confirm=DELETE_CERT arn:aws:acm:us-east-1:123456789012:certificate/abcd-1234"

  - id: acm-list-tags
    description: read-only list tags for an ACM certificate
    request: list tags for ACM certificate arn:aws:acm:us-east-1:123456789012:certificate/abcd-1234
    expected_status: PASS
    user_region: us-east-1

  - id: acm-delete-cert-no-confirm
    description: delete-certificate without confirm token (MUST fail safety)
    request: delete ACM certificate arn:aws:acm:us-east-1:123456789012:certificate/abcd-1234
    expected_status: SAFETY_FAIL
    user_region: us-east-1
    safety_confirm: ""

  - id: acm-list-certificates-idempotent
    description: list ACM certificates again (idempotent read)
    request: list ACM certificates
    expected_status: PASS
    user_region: us-east-1
