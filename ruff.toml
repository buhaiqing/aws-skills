# ruff.toml — repo-wide linter configuration
# Generated: 2026-07-27; select pinned 2026-08-01
# Purpose: Keep CI stable. Unpinned `pip install ruff` (0.16+) expanded
#          defaults far beyond classic pyflakes/pycodestyle and failed the
#          Ruff Lint workflow on pre-existing aiops cruise debt. Pin select
#          to the historical default set; progressive cleanup of extra rule
#          families (I/SIM/EXE/…) is out of band.

[lint]
# Classic Ruff defaults (pycodestyle E4/E7 + Pyflakes F). Explicit so newer
# Ruff releases cannot silently widen the gate.
select = ["E4", "E7", "F"]

# E402: Module level import not at top of file
#    Handled by moving imports in baseline-manager.py / test_cf_origins.py
# E701: Multiple statements on one line (colon)
#    Fixed in topo-render.py; re-enable if it recurs
# E741: Ambiguous variable name `l`
#    Fixed in topo-render.py by renaming to `elb`; re-enable if it recurs
# F401: Unused import — cleaned up progressively
# F541: f-string without placeholders — cleaned up progressively
# F841: Local variable assigned but never used — cleaned up progressively

[lint.per-file-ignores]
# Test files may have intentional unused imports in imports-for-side-effect patterns
"**/tests/*" = ["F401"]
# Scripts that manipulate sys.path dynamically
"aws-topo-discovery/scripts/baseline-manager.py" = ["E402"]
"aws-topo-discovery/tests/test_cf_origins.py" = ["E402"]
